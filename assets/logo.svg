<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6ec2"/>
      <stop offset="1" stop-color="#0e3a6e"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3effa"/>
    </linearGradient>
  </defs>

  <!-- rounded-square backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- layered "pack" sheets -->
  <rect x="128" y="176" width="256" height="36" rx="10" fill="#ffffff" opacity="0.45"/>
  <rect x="128" y="228" width="256" height="36" rx="10" fill="#ffffff" opacity="0.65"/>
  <rect x="128" y="280" width="256" height="36" rx="10" fill="#ffffff" opacity="0.85"/>

  <!-- main solution-pack face -->
  <rect x="128" y="120" width="256" height="220" rx="28" fill="url(#sheet)"/>
  <rect x="152" y="148" width="120" height="16" rx="8" fill="#1b6ec2" opacity="0.85"/>
  <rect x="152" y="180" width="180" height="12" rx="6" fill="#5aa7e6" opacity="0.6"/>
  <rect x="152" y="204" width="168" height="12" rx="6" fill="#5aa7e6" opacity="0.5"/>
  <rect x="152" y="228" width="140" height="12" rx="6" fill="#5aa7e6" opacity="0.4"/>

  <!-- spark / agent node -->
  <circle cx="360" cy="160" r="34" fill="#ffb300"/>
  <path d="M360 138 l10 22 22 4 -16 15 4 22 -20 -11 -20 11 4 -22 -16 -15 22 -4z" fill="#0e3a6e"/>
</svg>
