[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-agent"
version = "1.0.0"
description = "Copilot Studio Briefkit (cs-agent): design-first CLI that turns a business brief into an enterprise Microsoft Copilot Studio solution pack (EU/FI defaults, Learn-grounded)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cs-agent = "cs_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
